<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход в админ-панель — Кухни мира</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" method="post" action="#">
    <h1>Кухни мира</h1>
    <p class="sub">Год единства народов России — 2026</p>

    <div class="field">
      <label for="email">Электронная почта <span class="req">*</span></label>
      <input type="email" id="email" name="email" required
             placeholder="admin@champ2026" autocomplete="username">
      <div class="error-msg">Введите корректный email</div>
    </div>

    <div class="field">
      <label for="password">Пароль <span class="req">*</span></label>
      <input type="password" id="password" name="password" required
             minlength="6" placeholder="••••••••" autocomplete="current-password">
      <div class="error-msg">Пароль обязателен (не менее 6 символов)</div>
    </div>

    <button type="submit" class="btn btn-primary">Войти</button>
  </form>
</div>
</body>
</html>
