<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ингредиенты — админ-панель</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">Кухни мира <span>админ-панель</span></div>
  <div class="user">admin@champ2026 · <a href="login.html" style="color:#fff;text-decoration:underline">Выйти</a></div>
</header>

<nav class="nav">
  <a href="recipes.html">Рецепты</a>
  <a href="ingredients.html" class="active">Ингредиенты</a>
  <a href="categories.html">Категории</a>
  <a href="steps.html">Шаги рецептов</a>
  <a href="orders.html">Заказы</a>
</nav>

<main class="container">
  <div class="page-title">Ингредиенты</div>

  <div class="card" style="margin-bottom:18px">
    <form method="post" action="#">
      <div class="grid-2">
        <div class="field">
          <label for="ing-title">Название ингредиента <span class="req">*</span></label>
          <input type="text" id="ing-title" name="title" required maxlength="20"
                 placeholder="Например, Свекла">
          <div class="hint">Уникальное, максимум 20 символов</div>
          <div class="error-msg">Название обязательно (до 20 символов, уникальное)</div>
        </div>
        <div class="field">
          <label for="ing-unit">Единица измерения <span class="req">*</span></label>
          <select id="ing-unit" name="unit" required>
            <option value="">— выберите —</option>
            <option>шт</option><option>л</option><option>кг</option><option>мг</option><option>ст.л.</option>
          </select>
          <div class="error-msg">Выберите единицу измерения</div>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Добавить ингредиент</button>
    </form>
  </div>

  <div class="card" style="padding:0;overflow-x:auto">
    <table class="table">
      <thead>
        <tr><th>Название</th><th>Ед. измерения</th><th>Действия</th></tr>
      </thead>
      <tbody>
        <tr><td>Свекла</td><td>шт</td><td class="actions">
          <button class="btn btn-sm btn-ghost" type="button">Изменить</button>
          <button class="btn btn-sm btn-danger" type="button">Удалить</button>
        </td></tr>
        <tr><td>Говядина</td><td>кг</td><td class="actions">
          <button class="btn btn-sm btn-ghost" type="button">Изменить</button>
          <button class="btn btn-sm btn-danger" type="button">Удалить</button>
        </td></tr>
        <tr><td>Капуста</td><td>кг</td><td class="actions">
          <button class="btn btn-sm btn-ghost" type="button">Изменить</button>
          <button class="btn btn-sm btn-danger" type="button">Удалить</button>
        </td></tr>
        <tr><td>Соль</td><td>ст.л.</td><td class="actions">
          <button class="btn btn-sm btn-ghost" type="button">Изменить</button>
          <button class="btn btn-sm btn-danger" type="button">Удалить</button>
        </td></tr>
      </tbody>
    </table>
  </div>
</main>

</body>
</html>
